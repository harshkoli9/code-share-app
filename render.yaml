services:
  - type: web
    name: codeshare-api-harshkoli9
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: SERVE_CLIENT
        value: "false"
      - key: CLIENT_ORIGIN
        value: https://harshkoli9.github.io
      - key: JWT_SECRET
        generateValue: true
      - key: MONGODB_URI
        sync: false
